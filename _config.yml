# Site settings
title: Cookbook
email: your-email@domain.com
description: The plain text recipe database for hackers
baseurl: "/cookbook"

# Build settings
markdown: kramdown

permalink: /:title:output_ext

collections:
  recipes:
    output: true

exclude: ['Gemfile', 'Gemfile.lock', 'config/readme.md', 'config/LICENSE', 'config/tools']

# Keep private tooling out of the generated site while allowing public assets
# under config/images and config/manifest.webmanifest to be served.

# Recipe imports use GitHub Actions directly via the GitHub API.
# No server URL needed.
